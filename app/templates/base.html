<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ book.title }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">芯</span>
      <span>
        <strong>{{ book.title }}</strong>
        <small>入门 · 流程 · 协议</small>
      </span>
    </a>
    <nav class="topnav">
      <a href="/">手册</a>
      <a href="/mindmap">思维导图</a>
      <a href="/part/protocols">协议体系</a>
      <button type="button" class="ghost" id="open-agent">导学智能体</button>
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <aside id="agent-drawer" class="drawer" hidden>
    <div class="drawer-head">
      <div>
        <h2>导学智能体</h2>
        <p class="muted">{% if agent_ready %}已连接大模型，回答会引用教材章节。{% else %}未配置 API Key，先用教材检索导学。{% endif %}</p>
      </div>
      <button type="button" class="ghost" id="close-agent">关闭</button>
    </div>
    <div class="mode-row" id="agent-modes">
      <button type="button" data-mode="ask" class="on">自由问答</button>
      <button type="button" data-mode="guide">按模块导学</button>
      <button type="button" data-mode="quiz">出题测验</button>
    </div>
    <div id="agent-log" class="agent-log"></div>
    <form id="agent-form" class="agent-form">
      <textarea id="agent-input" rows="3" placeholder="例如：AXI 和 APB 有什么差别？下一章读什么？"></textarea>
      <button type="submit" class="primary">发送</button>
    </form>
  </aside>
  <div id="drawer-mask" class="mask" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
