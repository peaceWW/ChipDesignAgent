book:
  id: chip-design-handbook
  title: 芯片设计入门手册
  subtitle: 给行业小白的流程、模块与协议全景
  description: >
    从规格到量产，把数字芯片、FPGA、模拟混合信号和协议体系串成一张地图。
    每章只讲概念、作用、流程位置和应用场景，读完能开口讲清一颗芯片怎么做出来。
  hours: 12
  tags: [芯片设计, SoC, FPGA, 模拟, 协议, 入门]

